version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: normaize-postgres
    environment:
      POSTGRES_DB: normaize
      POSTGRES_USER: normaize_user
      POSTGRES_PASSWORD: normaize_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normaize_user -d normaize"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - normaize-network

  # Redis for caching (optional, for future use)
  redis:
    image: redis:7-alpine
    container_name: normaize-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - normaize-network

  # Application
  normaize-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: normaize-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=normaize;Username=normaize_user;Password=normaize_password
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - normaize-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  normaize-network:
    driver: bridge
