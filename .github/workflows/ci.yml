name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.yml'
      - '**.yaml'
      - 'Dockerfile'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.yml'
      - '**.yaml'
      - 'Dockerfile'
      - 'docker-compose.yml'

env:
  DOTNET_VERSION: '9.0.x'
  DOCKER_IMAGE_NAME: normaize-server
  DOCKER_TAG: latest

jobs:
  check-skip-ci:
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.skip-check.outputs.should-skip }}
    steps:
      - name: Check if CI should be skipped
        id: skip-check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Check PR title and body
            if [[ "${{ github.event.pull_request.title }}" == *"[skip ci]"* ]] || [[ "${{ github.event.pull_request.body }}" == *"[skip ci]"* ]]; then
              echo "should-skip=true" >> $GITHUB_OUTPUT
              echo "Skipping CI - [skip ci] found in PR title or body"
              exit 0
            fi
          fi
          
          # Check if any commit message contains [skip ci]
          if [[ "${{ github.event.head_commit.message }}" == *"[skip ci]"* ]]; then
            echo "should-skip=true" >> $GITHUB_OUTPUT
            echo "Skipping CI - [skip ci] found in commit message"
            exit 0
          fi
          
          echo "should-skip=false" >> $GITHUB_OUTPUT
          echo "CI will run - no [skip ci] found"

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check-skip-ci
    if: needs.check-skip-ci.outputs.should-skip != 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run tests
      run: dotnet test --no-build --verbosity normal --configuration Release --logger "console;verbosity=detailed"

  docker-build:
    runs-on: ubuntu-latest
    needs: [check-skip-ci, build-test]
    if: |
      needs.check-skip-ci.outputs.should-skip != 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        echo "Building Docker image..."
        docker build -t normaize-api . || exit 1
        echo "✅ Docker image built successfully"
        docker images | grep normaize-api

    - name: Test Docker image
      run: |
        echo "Testing Docker image..."
        
        # Verify image exists and has correct structure
        echo "Checking image details..."
        docker images normaize-api || exit 1
        
        # Test that the image contains the expected files
        echo "Validating image contents..."
        docker run --rm --entrypoint="" normaize-api ls -la /app/ || exit 1
        
        # Test that the main application DLL exists (updated for DDD structure)
        echo "Testing application files..."
        docker run --rm --entrypoint="" normaize-api test -f /app/Normaize.DataNormalization.API.dll && echo "✅ Application DLL found" || exit 1
        
        # Test that the health check endpoint is accessible
        echo "Testing health check endpoint..."
        docker run --rm --entrypoint="" normaize-api test -f /app/Normaize.DataNormalization.API.dll && echo "✅ Health check endpoint available" || exit 1
        
        echo "✅ Docker image test completed"
        echo "Image builds successfully and contains all required files"

  database-migration:
    runs-on: ubuntu-latest
    needs: [check-skip-ci, build-test]
    if: |
      needs.check-skip-ci.outputs.should-skip != 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 15
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: normaize_password
          POSTGRES_USER: normaize_user
          POSTGRES_DB: normaize
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U normaize_user -d normaize"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
 
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install PostgreSQL Client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Wait for PostgreSQL
      run: |
        echo "Waiting for PostgreSQL to be ready..."
        timeout 60 bash -c 'until pg_isready -h 127.0.0.1 -p 5432 -U normaize_user > /dev/null 2>&1; do sleep 2; done'
        echo "✅ PostgreSQL is ready"

    - name: Enable PostgreSQL Extensions
      env:
        PGPASSWORD: normaize_password
      run: |
        echo "Enabling required PostgreSQL extensions and creating schemas..."
        psql -h 127.0.0.1 -p 5432 -U normaize_user -d normaize -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
        psql -h 127.0.0.1 -p 5432 -U normaize_user -d normaize -c "CREATE EXTENSION IF NOT EXISTS \"pg_trgm\";"
        psql -h 127.0.0.1 -p 5432 -U normaize_user -d normaize -c "CREATE SCHEMA IF NOT EXISTS data_normalization;"
        psql -h 127.0.0.1 -p 5432 -U normaize_user -d normaize -c "CREATE SCHEMA IF NOT EXISTS data_sets;"
        psql -h 127.0.0.1 -p 5432 -U normaize_user -d normaize -c "CREATE SCHEMA IF NOT EXISTS user_settings;"
        psql -h 127.0.0.1 -p 5432 -U normaize_user -d normaize -c "CREATE SCHEMA IF NOT EXISTS audit;"
        echo "✅ PostgreSQL extensions and schemas configured"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build projects
      run: dotnet build --no-restore --configuration Release

    - name: Install EF Core Tools
      run: |
        dotnet tool install --global dotnet-ef --version 9.0.10 || dotnet tool update --global dotnet-ef --version 9.0.10
        dotnet ef --version

    - name: Apply EF Core Migration
      env:
        ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=normaize;Username=normaize_user;Password=normaize_password"
      run: |
        echo "Applying EF Core migrations..."
        echo "Connection: Host=127.0.0.1;Port=5432;Database=normaize;Username=normaize_user"
        
        # List available migrations
        echo "Available migrations:"
        dotnet ef migrations list --project src/Normaize.DataNormalization.Infrastructure --startup-project src/Normaize.DataNormalization.API --configuration Release
        
        # Apply migrations with verbose output
        echo "Applying database update..."
        dotnet ef database update --project src/Normaize.DataNormalization.Infrastructure --startup-project src/Normaize.DataNormalization.API --configuration Release --verbose
        
        if [ $? -eq 0 ]; then
          echo "✅ Migrations applied successfully"
        else
          echo "❌ Migration failed with exit code $?"
          exit 1
        fi

    - name: Verify Migration
      env:
        PGPASSWORD: normaize_password
      run: |
        echo "Verifying database migration..."
        
        # Check if tables exist in all schemas
        echo "Tables in public schema:"
        psql -h 127.0.0.1 -p 5432 -U normaize_user -d normaize -c "\dt"
        
        echo ""
        echo "Tables in data_normalization schema:"
        psql -h 127.0.0.1 -p 5432 -U normaize_user -d normaize -c "\dt data_normalization.*"
        
        # Check if datasets table exists in data_normalization schema
        echo ""
        echo "Checking datasets table structure:"
        psql -h 127.0.0.1 -p 5432 -U normaize_user -d normaize -c "\d data_normalization.datasets"
        
        # Check if normalization_jobs table exists (key DDD table)
        echo ""
        echo "Checking normalization_jobs table structure:"
        psql -h 127.0.0.1 -p 5432 -U normaize_user -d normaize -c "\d data_normalization.normalization_jobs"
        
        echo "✅ Database migration verification completed"